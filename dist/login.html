<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142758">
  <title>Entrar · Radar Comercial · Grupo ABR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <img class="login-logo" src="assets/logo-grupo-abr-branca.svg" alt="Grupo ABR">
      <p>PLATAFORMA DE INTELIGÊNCIA COMERCIAL</p>
      <h1>Inteligência de mercado que termina em uma boa visita.</h1>
      <span>Clientes, oportunidades e rotas comerciais em uma única operação do Grupo ABR.</span>
    </section>
    <section class="login-card">
      <p class="eyebrow">ACESSO RESTRITO</p>
      <h2>Entre na sua conta</h2>
      <p>Use as credenciais definidas para o ambiente de produção.</p>
      <form id="loginForm">
        <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
        <label>Senha<input type="password" name="password" autocomplete="current-password" minlength="12" required></label>
        <button class="primary-button" type="submit">Entrar</button>
        <div class="login-error" id="loginError" role="alert"></div>
      </form>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
